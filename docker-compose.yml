# placeholder

services:
  postgres:
    image: postgres:16
    container_name: congresso_postgres
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d congresso_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: